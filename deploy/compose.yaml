name: monopay

services:
  app:
    image: ${MONOPAY_IMAGE:-ghcr.io/shanggui/monopay}:${MONOPAY_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
      DB_PATH: /data/monopay.db
      TRUST_PROXY: 'true'
      APP_VERSION: ${MONOPAY_TAG:-dev}
    volumes:
      - ./data:/data
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
