name: monopay-ip

# No-domain / IP-only deployment.
# Use this only for LAN testing or when HTTPS is terminated by another proxy.
# For public production, prefer compose.yaml + Caddy + a DNS name.

services:
  app:
    image: ${MONOPAY_IMAGE:-ghcr.io/shanggui/monopay}:${MONOPAY_TAG:-latest}
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
      DB_PATH: /data/monopay.db
      BACKUP_DIR: /backup
      TRUST_PROXY: 'false'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${MONOPAY_TAG:-dev}
    ports:
      - '${APP_PORT:-3000}:3000'
    volumes:
      - ./data:/data
      - ./backups:/backup
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
